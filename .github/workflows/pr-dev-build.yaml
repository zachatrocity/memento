name: PR Dev Build (APK)

on:
  pull_request:
    types: [labeled, synchronize]

# Safe-by-default:
# - Uses pull_request (NOT pull_request_target) so secrets are not exposed to fork PRs.
# - Does not require any signing secrets.
# - On fork PRs, the token can't write PR comments; we skip commenting.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-dev-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Run when the PR gets the label, and on subsequent pushes while the label remains.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'dev-build') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'dev-build'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --build-number "${GITHUB_RUN_NUMBER}"

      - name: Extract SHA-1 fingerprint
        id: sha1
        run: |
          set -euo pipefail
          SHA1=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA1" | awk '{print $2}')
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "Debug APK SHA-1: $SHA1"

      - name: Prepare artifact
        id: prep
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            echo "Found APKs:";
            find build -maxdepth 6 -type f -name "*.apk" -print || true
            exit 1
          fi

          ARTIFACT_NAME="memento-pr-${{ github.event.pull_request.number }}-apk-${GITHUB_SHA}"
          OUT_APK="${ARTIFACT_NAME}.apk"
          cp "$APK_PATH" "$OUT_APK"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ steps.prep.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Comment on PR (same-repo PRs only)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.prep.outputs.artifact_name }}
          SHA1: ${{ steps.sha1.outputs.sha1 }}
        with:
          script: |
            const marker = '<!-- dev-build-artifact -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sha = context.payload.pull_request.head.sha;
            const timestamp = new Date().toISOString();
            const artifactName = process.env.ARTIFACT_NAME;
            const sha1 = process.env.SHA1;

            const body = [
              marker,
              '✅ **Dev build APK is ready**',
              '',
              `- Commit: \`${sha}\``,
              `- Built at: \`${timestamp}\``,
              `- Workflow run: ${runUrl}`,
              `- Artifact: \`${artifactName}\``,
              '',
              '### 🔐 OAuth Setup',
              'To use this APK with Google Photos, add this SHA-1 to your OAuth credential:',
              '',
              `**SHA-1:** \`${sha1}\``,
              '',
              'Package name: `com.zachatrocity.memento`',
              '',
              `Download: open the workflow run link above → scroll to **Artifacts** → download \`${artifactName}\` (zip) → extract the APK.`,
              '',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
