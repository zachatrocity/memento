name: Dev Release (dev-latest)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    # Avoid publishing on every push to main.
    # - Manual runs always publish
    # - Pushes publish only when the commit message includes [dev-release]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[dev-release]'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Configure Android signing (best-effort)
        run: scripts/ci/android_setup_signing.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        run: flutter build apk --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: Extract SHA-1 fingerprint
        id: sha1
        run: |
          set -euo pipefail
          SHA1=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA1" | awk '{print $2}')
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "Release APK SHA-1: $SHA1"

      - name: Prepare asset
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk memento-dev-latest.apk

      - name: Publish/update GitHub Release (dev-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dev-latest"
          TITLE="dev-latest"
          SHA1="${{ steps.sha1.outputs.sha1 }}"
          NOTES="Automated rolling dev build from ${GITHUB_SHA}

## 🔐 OAuth Setup Required

This APK uses a shared debug keystore for Obtanium distribution.

**SHA-1 Fingerprint:** \`$SHA1\`

### To use with Google Photos:
1. Create OAuth credentials at [Google Cloud Console](https://console.cloud.google.com/)
2. Select **Android** application type
3. Package name: \`com.zachatrocity.memento\`
4. Add this SHA-1 to the credential
5. Copy the Client ID and paste it in the app Settings

**Note:** This SHA-1 is valid for all dev builds from this repository."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

          gh release upload "$TAG" memento-dev-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
